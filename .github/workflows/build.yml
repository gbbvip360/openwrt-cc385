name: build-cc385
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: openwrt-24.10

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget device-tree-compiler

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            staging_dir
            build_dir/host
            dl
          key: cc385-toolchain-24.10

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_armada-385-db-ap=y
          CONFIG_PACKAGE_kmod-ath10k=y
          CONFIG_PACKAGE_ath10k-firmware-qca988x=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-ata-ahci=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig

      - name: Prepare kernel tree
        run: make target/linux/prepare V=s

      - name: Patch DTS partition table
        run: |
          cat > /tmp/patch_dts.py <<'PYEOF'
          import glob, re
          dts = glob.glob('build_dir/target-*/linux-mvebu_cortexa9/linux-*/arch/arm/boot/dts/**/armada-385-db-ap.dts', recursive=True)
          assert len(dts) == 1, dts
          p = dts[0]
          s = open(p).read()
          # 删掉官方默认的 3 个分区节点
          s = re.sub(r'\n[ \t]*(?:mtd\d+|partition)@[0-9a-fA-F]+[ \t]*\{[^{}]*\};', '', s)
          NEW = '''
          			partition@0 {
          				label = "u-boot";
          				reg = <0x00000000 0x00800000>;
          				read-only;
          			};

          			partition@800000 {
          				label = "env";
          				reg = <0x00800000 0x00080000>;
          			};

          			partition@880000 {
          				label = "s_env";
          				reg = <0x00880000 0x00080000>;
          			};

          			partition@900000 {
          				label = "devinfo";
          				reg = <0x00900000 0x00100000>;
          			};

          			partition@a00000 {
          				label = "kernel1";
          				reg = <0x00a00000 0x1ef00000>;
          			};

          			partition@1200000 {
          				label = "pri_rootfs";
          				reg = <0x01200000 0x1e700000>;
          			};

          			partition@1f900000 {
          				label = "kernel2";
          				reg = <0x1f900000 0x1ef00000>;
          			};

          			partition@20100000 {
          				label = "alt_rootfs";
          				reg = <0x20100000 0x1e700000>;
          			};

          			partition@3e800000 {
          				label = "syscfg";
          				reg = <0x3e800000 0x01800000>;
          			};
          '''
          anchor = 'nand-on-flash-bbt;'
          assert anchor in s, 'anchor not found'
          assert 'kernel1' not in s
          s = s.replace(anchor, anchor + '\n' + NEW, 1)
          open(p, 'w').write(s)
          print('patched:', p)
          PYEOF
          python3 /tmp/patch_dts.py

      - name: Build
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-cc385
          path: bin/targets/mvebu/cortexa9/*
          if-no-files-found: error
